version: '3.8'

services:
  api:
    build: .
    container_name: testing-platform-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=enterprise-ai-testing-platform
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./prompts:/app/prompts
      - ./contracts:/app/contracts
      - ./docs/contracts:/app/docs/contracts
    networks:
      - testing-platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  testing-platform:
    driver: bridge

volumes:
  storage:
  prompts:
  contracts:
